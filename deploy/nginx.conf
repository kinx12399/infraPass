# /etc/nginx/sites-available/infrapass
# Public LB terminates HTTPS and forwards HTTP to WEB:80.
# Only public LB addresses may reach WEB:80 (enforce in security groups).
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
upstream infrapass_was {
    server 192.168.22.19:8080;
    keepalive 32;
}
server {
    listen 80 default_server;
    server_name _;
    root /var/www/infrapass;
    index index.html;
    charset utf-8;
    server_tokens off;
    client_max_body_size 64k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
    location /api/ {
        proxy_pass http://infrapass_was;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 25s;
        proxy_next_upstream off;
    }
    location /api/auth/ {
        # Until trusted LB real-IP handling is configured this limits LB IPs.
        limit_req zone=auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://infrapass_was;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 25s;
        proxy_next_upstream off;
    }
    location / { try_files $uri $uri/ /index.html; }
    location ~ /\. { deny all; }
}
